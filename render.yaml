# Render Blueprint for the Workout Equalizer API.
# Dashboard: New → Blueprint → connect this repo (or create a Web Service manually).
# After the first deploy, set EMAIL, PASSWORD, and CORS_ORIGINS in the service env.

services:
  - type: web
    name: workout-equalizer-api
    runtime: python
    plan: free
    rootDir: webapp/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: WORKOUT_DATA_DIR
        value: /opt/render/project/src/data
      - key: GARMINTOKENS
        value: /opt/render/project/src/data/.garminconnect
      - key: EMAIL
        sync: false
      - key: PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
